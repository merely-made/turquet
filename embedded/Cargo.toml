[package]
rust-version = "1.97.1"
name = "turquet-embedded"
version = "0.1.0"
edition = "2021"
description = "No-std geometry core for Turquet embedded profiles"
license = "MIT"
repository = "https://github.com/merely-made/turquet"

[lib]
path = "src/lib.rs"

[dev-dependencies]
turquet = { path = ".." }

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"
